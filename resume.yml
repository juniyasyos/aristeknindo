  website_content_model:
    # Struktur ini mengacu pada Information Architecture di SRS (Bagian 4).
    # Urutan mencerminkan urutan navigasi utama website.
    navigation_structure: |
      Home
      ├─ About (Company Profile + Vision & Mission)
      ├─ Services / Capabilities
      ├─ Products
      ├─ Industries          [ON HOLD]
      ├─ Projects / Portfolio
      └─ Contact / Request a Quote

    recommended_primary_sections:
      - key: "home"
        label: "Home"
        nav_order: 1
        srs_ref: "5.1"
        content:
          - "Hero (headline + deskripsi singkat + CTA)"
          - "Company introduction singkat"
          - "Core capabilities / layanan utama"
          - "Featured products preview"
          - "Selected projects preview"
          - "Trust / company info"
          - "CTA (WhatsApp / form)"

      - key: "about"
        label: "About"
        nav_order: 2
        srs_ref: "5.2"
        sub_pages:
          - key: "company-profile"
            label: "Company Profile"
            content:
              - "Identitas perusahaan"
              - "Deskripsi bisnis"
              - "Lingkup layanan"
              - "Target industri"
          - key: "vision-mission"
            label: "Visi & Misi"
            content_status: "missing"
            note: "Perlu disediakan oleh client"
        additional_content:
          - "Legalitas / sertifikasi (jika ada dan disetujui)"

      - key: "services"
        label: "Services / Capabilities"
        nav_order: 3
        srs_ref: "5.3"
        categories:
          - "Automation & Control (PLC)"
          - "Mekanikal & Machining"
          - "Fabrikasi"
          - "Konstruksi"
          - "Installation & Troubleshooting"
        notes:
          - "Workshop (mesin bubut, milling, CNC) masuk sebagai sub-section di sini, bukan halaman tersendiri"
        workshop_subsection:
          label: "Fasilitas Workshop"
          equipment:
            - "Mesin Bubut"
            - "Mesin Milling"
            - "Center Bor"
            - "Mesin CNC"

      - key: "products"
        label: "Products"
        nav_order: 4
        srs_ref: "5.4"
        categories:
          - "Automation & Control Part"
          - "Mekanikal Part"
        content_status: "perlu konfirmasi produk aktif dari client"

      - key: "industries"
        label: "Industries"
        nav_order: 5
        srs_ref: "5.5"
        status: "on_hold"
        reason: >
          Data sektor industri tidak tersedia secara eksplisit di Company Profile.
          PDF hanya menyebut satu sektor (otomotif) tanpa rincian lebih lanjut.
          Halaman ini ditunda sampai ada konfirmasi dan data tambahan dari client.
        available_data:
          - sector: "Otomotif"
            source: "Company Profile PDF Hal. 2"
            note: "Disebut eksplisit sebagai sektor yang didukung"
          - sector: "Industri Manufaktur Umum"
            source: "Implied dari 'pabrik-pabrik' di Company Profile"
            note: "Inferensi — perlu konfirmasi client sebelum ditampilkan"
        pending_client_input:
          - "Daftar sektor industri yang sudah pernah dilayani"
          - "Daftar sektor yang ingin dijangkau"
          - "Persetujuan untuk menampilkan nama/logo klien per industri"

      - key: "projects"
        label: "Projects / Portfolio"
        nav_order: 6
        srs_ref: "5.6"
        available_projects:
          - "Pembuatan Panel Control Weighing Automation System"
          - "Instalasi Cable Tray"
          - "Troubleshot dan Instalasi Servo Motor FANUC"
          - "Upgrade HMI Allen-Bradley"
        content_status: "limited"
        pending_client_input:
          - "Foto dokumentasi tiap project"
          - "Detail scope, lokasi, dan periode project"
          - "Persetujuan client untuk publish"

      - key: "contact"
        label: "Contact / Request a Quote"
        nav_order: 7
        srs_ref: "5.7"
        content:
          - "Alamat kantor"
          - "Nomor telepon"
          - "Email"
          - "Integrasi WhatsApp CTA"
          - "Form inquiry / permintaan quotation"
          - "Jam operasional (perlu konfirmasi client)"

